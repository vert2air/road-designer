name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# ディレクトリ構成:
#   road_designer/
#   ├── src/           ← アプリ本体（*.py）
#   ├── tests/         ← テストコード（test_*.py, conftest.py）
#   ├── pyproject.toml ← pytest / coverage の設定を一元管理
#   └── uv.lock

jobs:
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true   # uv.lock を使ったキャッシュを有効化

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # uv.lock で再現性のあるインストール。dev グループも含める
        run: uv sync --group dev

      # ── Linux: Qt の X11 依存ライブラリをインストール ──────────────────────
      - name: Install Qt dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxcb-shape0 \
            libxcb-xfixes0

      # ── Linux: 仮想ディスプレイの代わりに Qt offscreen プラグインを使用 ──
      #    xvfb-run は不要。PySide6 の offscreen バックエンドだけで十分。
      - name: Set Qt offscreen platform (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

      # ── テスト実行（全 OS 共通） ────────────────────────────────────────────
      #    --cov / --cov-report=term-missing は pyproject.toml の addopts に記載済み。
      #    ここでは Codecov 向けの XML レポートだけ追加する。
      - name: Run tests
        run: uv run pytest tests/ --cov-report=xml

      # ── カバレッジを Codecov にアップロード（ubuntu + 最新 Python のみ） ──
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
